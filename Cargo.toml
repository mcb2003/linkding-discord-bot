[package]
name = "linkding-discord-bot"
version = "0.1.0"
authors = ["Michael Connor Buchan <mikey@blindcomputing.org>"]
edition = "2024"

[profile.release]
lto = "fat"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
poise = "0.7.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = [
    "macros",
    "rt-multi-thread",
    "tracing",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
